<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="pageTitle">Fashion Стиль — Інтернет-магазин одягу</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: {
                50: '#fdf8f6', 100: '#f2e8e5', 600: '#8c6d62', 700: '#73574d', 800: '#59423a', 900: '#402e28'
            } } } }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        input, select, textarea { font-size: 16px !important; }
        header { padding-top: env(safe-area-inset-top, 0px); }
        #mobileBottomBar { padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
        #adminPanel, #cartDrawer { padding-top: env(safe-area-inset-top, 0px); }
        body { padding-bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); }
        @media (min-width: 768px) { body { padding-bottom: 0; } }

        .upload-slot {
            aspect-ratio: 1/1; border: 1px dashed #d4d4d4; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #737373; position: relative; overflow: hidden;
            cursor: pointer; background: #fafafa; min-height: 44px;
        }
        .upload-slot img, .upload-slot video { width: 100%; height: 100%; object-fit: cover; }
        .video-slot { aspect-ratio: unset; height: 90px; }
        .upload-slot input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .upload-slot .remove-x {
            position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.7); color: #fff;
            width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 12px; z-index: 2; cursor: pointer;
        }
        .conn-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; }
        .progress-bar { width:100%; background:#e5e5e5; height:6px; border-radius:3px; overflow:hidden; }
        .progress-fill { height:100%; background:#73574d; transition:width .3s; }
        .tag { display:inline-flex; align-items:center; gap:6px; border:1px solid #d4d4d4; background:#fafafa; padding:5px 6px 5px 12px; border-radius:20px; font-size:12px; margin:0 6px 6px 0; }
        .tag button { background:none; border:none; color:#737373; cursor:pointer; padding:2px 4px; font-size:13px; }
        .size-chip { border:1px solid #d4d4d4; border-radius:16px; padding:5px 12px; font-size:11px; cursor:pointer; background:#fff; }
        .size-chip.active { background:#73574d; color:#fff; border-color:#73574d; }
        .product-admin-card { border:1px solid #e5e5e5; border-radius:12px; padding:12px; margin-bottom:12px; background:#fafafa; }
        .filter-group-card { border:1px solid #e5e5e5; border-radius:10px; padding:12px; margin-bottom:10px; background:#fff; }
        .mini-icon-btn { background:none; border:none; color:#737373; cursor:pointer; padding:4px 6px; font-size:13px; }
        .storage-warning { background:#fef08a; border: 1px solid #fcd34d; color:#92400e; padding: 12px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; }
        .storage-danger { background:#fee2e2; border: 1px solid #fca5a5; color:#991b1b; }
        .import-tab-btn { padding: 12px 16px; border: none; background: #f3f4f6; cursor: pointer; font-weight: bold; text-sm; border-bottom: 3px solid transparent; transition: all 0.3s; }
        .import-tab-btn.active { background: #fff; border-bottom-color: #73574d; color: #73574d; }
        .history-item { border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px; margin-bottom: 10px; background: #fafafa; font-size: 12px; }
    </style>
</head>
<body class="bg-brand-50 text-neutral-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- MAIN HEADER -->
    <header class="bg-white border-b border-neutral-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-3 py-3 flex items-center justify-between gap-2">
            <button onclick="window.filterCategory('all'); window.scrollTo({top:0, behavior:'smooth'});" class="flex items-center gap-2 text-left shrink-0">
                <div id="headerLogoIcon" class="bg-brand-700 text-white w-9 h-9 rounded-lg flex items-center justify-center font-bold text-lg overflow-hidden">F</div>
                <div>
                    <span id="headerStoreName" class="text-base font-bold tracking-wider text-neutral-900 block leading-none">FASHION СТИЛЬ</span>
                    <span id="connStatus" class="text-[9px] text-neutral-500 tracking-widest uppercase"><span class="conn-dot" style="background:#ccc;"></span>Підключення…</span>
                </div>
            </button>

            <div class="flex-1 max-w-md mx-2">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Пошук товарів..."
                           class="w-full pl-8 pr-3 py-1.5 border border-neutral-300 rounded-full focus:outline-none focus:border-brand-700">
                    <span class="absolute left-2.5 top-2 text-neutral-400 text-xs">🔍</span>
                </div>
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="window.requestAdminAccess()" class="p-2.5 bg-neutral-100 hover:bg-neutral-200 text-neutral-700 rounded-lg text-sm font-medium transition min-w-[40px] min-h-[40px]" title="Адмін-панель">⚙️</button>
                <button onclick="window.toggleCartDrawer()" class="relative flex items-center gap-1 px-3 py-2.5 bg-brand-700 hover:bg-brand-800 text-white rounded-lg text-xs font-medium transition shadow-sm min-h-[40px]">
                    🛒 <span id="cartBadge" class="bg-amber-400 text-neutral-900 text-[10px] px-1.5 py-0.2 rounded-full font-bold">0</span>
                </button>
            </div>
        </div>

        <nav class="bg-brand-800 text-white px-2">
            <div id="categoryNav" class="max-w-7xl mx-auto flex items-center gap-4 overflow-x-auto py-2.5 text-xs whitespace-nowrap"></div>
        </nav>
    </header>

    <section class="max-w-7xl mx-auto px-3 mt-3">
        <div id="dynamicBannerContainer" class="relative rounded-xl overflow-hidden shadow-md h-44 bg-neutral-900 flex items-center"></div>
    </section>

    <main class="max-w-7xl mx-auto px-3 py-4 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-4">

        <aside class="space-y-3 lg:col-span-1 bg-white p-3 rounded-xl shadow-sm border border-neutral-200 h-fit">
            <div class="flex justify-between items-center cursor-pointer lg:cursor-default" onclick="window.toggleMobileFilters()">
                <h3 class="font-bold text-sm text-neutral-900">Фільтри та сортування</h3>
                <span id="filterToggleIcon" class="lg:hidden text-neutral-500 font-bold text-xs">▼</span>
            </div>

            <div id="filterContent" class="space-y-3 hidden lg:block pt-2">
                <div>
                    <label class="block text-[11px] font-medium text-neutral-700 mb-1">Ціна (UAH):</label>
                    <div class="flex gap-2 items-center">
                        <input type="number" id="minPrice" placeholder="Від" oninput="window.applyFilters()" class="w-full px-2 py-1.5 border rounded-lg">
                        <span>-</span>
                        <input type="number" id="maxPrice" placeholder="До" oninput="window.applyFilters()" class="w-full px-2 py-1.5 border rounded-lg">
                    </div>
                </div>

                <div id="dynamicFilterGroups" class="space-y-3"></div>

                <div>
                    <label class="block text-[11px] font-medium text-neutral-700 mb-1">Сортування:</label>
                    <select id="sortOrder" onchange="window.applyFilters()" class="w-full px-2 py-1.5 border rounded-lg">
                        <option value="default">За замовчуванням</option>
                        <option value="cheap">Від дешевих до дорогих</option>
                        <option value="expensive">Від дорогих до дешевих</option>
                    </select>
                </div>

                <button onclick="window.resetFilters()" class="w-full py-2 bg-neutral-100 hover:bg-neutral-200 text-neutral-700 rounded-lg text-xs font-medium transition">Скинути фільтри</button>
            </div>
        </aside>

        <section class="lg:col-span-3 flex flex-col gap-3">
            <div class="flex justify-between items-center bg-white p-2.5 rounded-xl border border-neutral-200 shadow-sm">
                <h1 id="catalogTitle" class="text-sm font-bold text-neutral-900">Каталог товарів</h1>
                <div class="text-[11px] text-neutral-500" id="productCount">Знайдено: 0</div>
            </div>
            <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 gap-2.5"></div>
        </section>
    </main>

    <div id="mobileBottomBar" class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-neutral-200 z-40 flex justify-around items-center pt-2 px-1 shadow-2xl">
        <button onclick="window.filterCategory('all'); window.scrollTo({top:0, behavior:'smooth'});" class="flex flex-col items-center text-neutral-600 hover:text-brand-700 text-[10px] min-h-[44px] justify-center px-2"><span class="text-base">🏠</span> Головна</button>
        <button onclick="window.toggleCartDrawer()" class="flex flex-col items-center text-neutral-600 hover:text-brand-700 text-[10px] relative min-h-[44px] justify-center px-2"><span class="text-base">🛒</span> Кошик</button>
        <button onclick="window.open('https://t.me/yuli666666', '_blank')" class="flex flex-col items-center text-neutral-600 hover:text-brand-700 text-[10px] min-h-[44px] justify-center px-2"><span class="text-base">💬</span> Telegram</button>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminOverlay" class="fixed inset-0 bg-black/50 z-50 hidden" onclick="window.toggleAdminPanel()"></div>
    <div id="adminPanel" class="fixed right-0 top-0 h-full w-full max-w-md bg-white z-50 shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-4 bg-brand-800 text-white flex justify-between items-center">
            <h2 class="font-bold text-lg">Панель адміністратора</h2>
            <button onclick="window.toggleAdminPanel()" class="text-white hover:text-amber-300 text-xl font-bold w-10 h-10">&times;</button>
        </div>
        <div class="p-6 flex-1 overflow-y-auto space-y-6">

            <!-- STORAGE COUNTER - ОЧЕНЬ ВАЖНО! -->
            <div id="storageWarningBox" class=""></div>
            <div class="bg-neutral-50 p
