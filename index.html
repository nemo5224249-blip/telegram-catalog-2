<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог товарів</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 60px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 16px;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .search-box {
      position: relative;
      flex-grow: 1;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text-main);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .admin-btn-trigger {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
    }

    .admin-btn-trigger:hover {
      color: var(--accent);
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .chip {
      background-color: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .chip.active, .chip:hover {
      background-color: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card-media {
      position: relative;
      width: 100%;
      padding-top: 75%;
      background-color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-media img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-media svg {
      position: absolute;
      width: 48px;
      height: 48px;
      color: var(--border);
    }

    .photo-count {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-cat {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      margin-top: auto;
      margin-bottom: 12px;
    }

    .order-btn {
      width: 100%;
      padding: 10px;
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
    }

    .order-btn:hover {
      background-color: var(--accent-hover);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .overlay.open {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      padding: 20px;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .detail-media-container {
      width: 100%;
      height: 300px;
      background: #0f172a;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-media-container img, .detail-media-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .detail-thumbs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 16px;
    }

    .detail-thumb {
      width: 60px;
      height: 60px;
      border-radius: 6px;
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .detail-thumb.active {
      border-color: var(--accent);
    }

    .detail-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .vid-badge {
      font-size: 0.6rem;
      color: var(--accent);
      font-weight: bold;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: -400px;
      width: 100%;
      max-width: 400px;
      height: 100%;
      background: var(--card-bg);
      border-left: 1px solid var(--border);
      z-index: 300;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .drawer.open {
      right: 0;
    }

    .drawer-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-body {
      padding: 16px;
      overflow-y: auto;
      flex-grow: 1;
    }

    .admin-section {
      margin-bottom: 24px;
    }

    .admin-section h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .field input, .field textarea, .field select {
      width: 100%;
      padding: 8px;
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-main);
      outline: none;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
    }

    .btn.primary {
      background: var(--accent);
      color: #0f172a;
    }

    .btn.danger {
      background: var(--danger);
      color: #fff;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .tag {
      background: var(--bg-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag button {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
    }

    .product-admin-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      background: var(--bg-color);
    }

    .admin-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .photo-slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .upload-box {
      border: 1px dashed var(--border);
      border-radius: 4px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .upload-box input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .upload-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .upload-box .remove-x {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(0, 0, 0, 0.7);
      color: var(--danger);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      z-index: 2;
    }
  </style>
</head>
<body>

<header>
  <div class="header-container">
    <h1 id="siteTitle">Каталог товарів</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Пошук товарів...">
    </div>
    <button class="admin-btn-trigger" id="openAdminLogin" title="Адмін-панель">⚙️</button>
  </div>
</header>

<div class="container">
  <div class="categories" id="categoryChips"></div>
  <div class="grid" id="productGrid"></div>
  <div class="empty-state" id="emptyState" style="display: none;">Товарів не знайдено</div>
</div>

<!-- Modal Detail -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <button class="modal-close" id="detailClose">&times;</button>
    <div class="detail-media-container" id="detailMain"></div>
    <div class="detail-thumbs" id="detailThumbs"></div>
    <p class="card-cat" id="detailCat"></p>
    <h2 id="detailName" style="margin-bottom: 8px;"></h2>
    <p id="detailDesc" style="color: var(--text-muted); margin-bottom: 16px; font-size: 0.95rem; line-height: 1.4;"></p>
    <div class="card-price" id="detailPrice" style="font-size: 1.5rem;"></div>
    <a href="#" target="_blank" class="order-btn" id="detailOrderBtn">Замовити у Telegram</a>
  </div>
</div>

<!-- Login Modal -->
<div class="overlay" id="loginOverlay">
  <div class="modal" style="max-width: 320px;">
    <h3 style="margin-bottom: 12px;">Вхід в адмін-панель</h3>
    <div class="field">
      <input type="password" id="loginPassword" placeholder="Введіть пароль">
    </div>
    <p id="loginError" style="color: var(--danger); font-size: 0.8rem; margin-bottom: 8px;"></p>
    <button class="btn primary" id="loginSubmit">Увійти</button>
    <button class="btn" id="loginCancel" style="margin-top: 6px; background: transparent; color: var(--text-muted);">Скасувати</button>
  </div>
</div>

<!-- Admin Drawer -->
<div class="overlay" id="adminOverlay"></div>
<aside class="drawer" id="adminDrawer">
  <div class="drawer-header">
    <h2>Управління</h2>
    <button class="modal-close" id="adminClose" style="position: static;">&times;</button>
  </div>
  <div class="drawer-body">
    
    <div class="admin-section">
      <h3>Загальні налаштування</h3>
      <div class="field">
        <label>Назва магазину</label>
        <input type="text" id="adminTitle">
      </div>
      <button class="btn primary" id="exportBtn" style="margin-top: 8px;">Експортувати index.html</button>
    </div>

    <div class="admin-section">
      <h3>Категорії</h3>
      <div class="tag-list" id="adminCategoryTags"></div>
      <div class="admin-row">
        <input type="text" id="newCategory" placeholder="Нова категория">
        <button class="btn primary" id="addCategory" style="width: auto;">+</button>
      </div>
    </div>

    <div class="admin-section">
      <h3>Товари</h3>
      <button class="btn primary" id="addProduct" style="margin-bottom: 12px;">+ Додати товар</button>
      <div id="adminProducts"></div>
    </div>

    <div class="admin-section">
      <button class="btn danger" id="adminLogout">Вийти з панелі</button>
    </div>

  </div>
</aside>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyOc-BE2SqzP27PPnNF9MYys9aaapD9N2xk",
    authDomain: "telegram-catalog-2.firebaseapp.com",
    projectId: "telegram-catalog-2",
    storageBucket: "telegram-catalog-2.appspot.com",
    messagingSenderId: "461518963018",
    appId: "1:461518963018:web:fae25cc1dec5da07c35f13"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const catalogDocRef = doc(db, "catalog", "mainData");

  let INITIAL_DATA = {
    siteTitle: "Каталог товарів",
    categories: ["Усі", "Одежда", "Обувь", "Аксессуары"],
    products: [
      {
        id: "1",
        title: "Базовая футболка",
        category: "Одежда",
        price: 450,
        desc: "Качественная хлопковая футболка классического кроя.",
        photos: [],
        video: ""
      }
    ]
  };

  let state = { ...INITIAL_DATA };
  let currentCategory = "Усі";
  let searchQuery = "";
  let isAdmin = false;
  let activeDetailProduct = null;
  let activeMediaIndex = 0;

  const TELEGRAM_USERNAME = "your_telegram_username";

  const siteTitleEl = document.getElementById("siteTitle");
  const searchInput = document.getElementById("searchInput");
  const categoryChips = document.getElementById("categoryChips");
  const productGrid = document.getElementById("productGrid");
  const emptyState = document.getElementById("emptyState");

  const detailOverlay = document.getElementById("detailOverlay");
  const detailClose = document.getElementById("detailClose");
  const detailMain = document.getElementById("detailMain");
  const detailThumbs = document.getElementById("detailThumbs");
  const detailCat = document.getElementById("detailCat");
  const detailName = document.getElementById("detailName");
  const detailDesc = document.getElementById("detailDesc");
  const detailPrice = document.getElementById("detailPrice");
  const detailOrderBtn = document.getElementById("detailOrderBtn");

  const openAdminLoginBtn = document.getElementById("openAdminLogin");
  const loginOverlay = document.getElementById("loginOverlay");
  const loginPassword = document.getElementById("loginPassword");
  const loginError = document.getElementById("loginError");
  const loginSubmit = document.getElementById("loginSubmit");
  const loginCancel = document.getElementById("loginCancel");

  const adminOverlay = document.getElementById("adminOverlay");
  const adminDrawer = document.getElementById("adminDrawer");
  const adminClose = document.getElementById("adminClose");
  const adminLogout = document.getElementById("adminLogout");
  const exportBtn = document.getElementById("exportBtn");
  const adminTitleInput = document.getElementById("adminTitle");
  const adminCategoryTags = document.getElementById("adminCategoryTags");
  const newCategoryInput = document.getElementById("newCategory");
  const addCategoryBtn = document.getElementById("addCategory");
  const adminProductsList = document.getElementById("adminProducts");
  const addProductBtn = document.getElementById("addProduct");

  function listenToFirebase() {
    onSnapshot(catalogDocRef, (docSnap) => {
      if (docSnap.exists()) {
        const remoteData = docSnap.data();
        state = {
          siteTitle: remoteData.siteTitle || INITIAL_DATA.siteTitle,
          categories: remoteData.categories || INITIAL_DATA.categories,
          products: remoteData.products || INITIAL_DATA.products
        };
        renderAll();
      } else {
        saveToFirebase(INITIAL_DATA);
      }
    }, (error) => {
      console.error("Ошибка чтения Firebase: ", error);
    });
  }

  async function saveToFirebase(newData) {
    try {
      await setDoc(catalogDocRef, newData);
    } catch (e) {
      console.error("Ошибка сохранения в Firebase: ", e);
    }
  }

  function renderAll() {
    siteTitleEl.textContent = state.siteTitle;
    adminTitleInput.value = state.siteTitle;
    renderCategories();
    renderProducts();
    if (isAdmin) {
      renderAdminCategories();
      renderAdminProducts();
    }
  }

  function renderCategories() {
    categoryChips.innerHTML = "";
    state.categories.forEach(cat => {
      const btn = document.createElement("button");
      btn.className = `chip ${cat === currentCategory ? "active" : ""}`;
      btn.textContent = cat;
      btn.onclick = () => {
        currentCategory = cat;
        renderCategories();
        renderProducts();
      };
      categoryChips.appendChild(btn);
    });
  }

  function renderProducts() {
    productGrid.innerHTML = "";
    const filtered = state.products.filter(p => {
      const matchesCat = (currentCategory === "Усі") || (p.category === currentCategory);
      const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                            p.desc.toLowerCase().includes(searchQuery.toLowerCase());
      return matchesCat && matchesSearch;
    });

    if (filtered.length === 0) {
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    filtered.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      
      const mediaThumb = p.photos && p.photos.length > 0 
        ? `<img src="${p.photos[0]}" alt="${p.title}">`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;

      const photoCountBadge = p.photos && p.photos.length > 1 
        ? `<span class="photo-count">+${p.photos.length - 1}</span>` 
        : "";

      card.innerHTML = `
        <div class="card-media">
          ${mediaThumb}
          ${photoCountBadge}
        </div>
        <div class="card-body">
          <p class="card-cat">${p.category || ""}</p>
          <h3 class="card-name">${p.title}</h3>
          <p class="card-desc">${p.desc}</p>
          <p class="card-price">${p.price} ₴</p>
          <button class="order-btn" onclick="event.stopPropagation(); openDetail('${p.id}')">Детальніше</button>
        </div>
      `;
      card.onclick = () => openDetail(p.id);
      productGrid.appendChild(card);
    });
  }

  window.openDetail = function(id) {
    const p = state.products.find(item => item.id === id);
    if (!p) return;
    activeDetailProduct = p;
    activeMediaIndex = 0;

    detailCat.textContent = p.category || "";
    detailName.textContent = p.title;
    detailDesc.textContent = p.desc;
    detailPrice.textContent = `${p.price} ₴`;
    
    const message = encodeURIComponent(`Доброго дня! Цікавить товар: ${p.title} (Ціна: ${p.price} ₴)`);
    detailOrderBtn.href = `https://t.me/${TELEGRAM_USERNAME}?text=${message}`;

    renderDetailMedia();
    detailOverlay.classList.add("open");
  };

  function renderDetailMedia() {
    if (!activeDetailProduct) return;
    const mediaList = [];
    if (activeDetailProduct.photos) {
      activeDetailProduct.photos.forEach(url => mediaList.push({ type: 'image', url }));
    }
    if (activeDetailProduct.video) {
      mediaList.push({ type: 'video', url: activeDetailProduct.video });
    }

    detailMain.innerHTML = "";
    detailThumbs.innerHTML = "";

    if (mediaList.length === 0) {
      detailMain.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`;
      return;
    }

    const currentMedia = mediaList[activeMediaIndex] || mediaList[0];
    if (currentMedia.type === 'image') {
      detailMain.innerHTML = `<img src="${currentMedia.url}" alt="">`;
    } else {
      detailMain.innerHTML = `<video src="${currentMedia.url}" controls autoplay loop></video>`;
    }

    if (mediaList.length > 1) {
      mediaList.forEach((item, idx) => {
        const thumb = document.createElement("div");
        thumb.className = `detail-thumb ${idx === activeMediaIndex ? "active" : ""}`;
        if (item.type === 'image') {
          thumb.innerHTML = `<img src="${item.url}" alt="">`;
        } else {
          thumb.innerHTML = `<div class="vid-badge">VIDEO</div>`;
        }
        thumb.onclick = () => {
          activeMediaIndex = idx;
          renderDetailMedia();
        };
        detailThumbs.appendChild(thumb);
      });
    }
  }

  detailClose.onclick = () => detailOverlay.classList.remove("open");

  searchInput.oninput = (e) => {
    searchQuery = e.target.value;
    renderProducts();
  };

  openAdminLoginBtn.onclick = () => {
    if (isAdmin) {
      openAdminDrawer();
    } else {
      loginOverlay.classList.add("open");
    }
  };

  loginCancel.onclick = () => {
    loginOverlay.classList.remove("open");
    loginError.textContent = "";
    loginPassword.value = "";
  };

  loginSubmit.onclick = () => {
    if (loginPassword.value === "admin123") {
      isAdmin = true;
      loginOverlay.classList.remove("open");
      loginError.textContent = "";
      loginPassword.value = "";
      openAdminDrawer();
      renderAll();
    } else {
      loginError.textContent = "Невірний пароль!";
    }
  };

  function openAdminDrawer() {
    adminOverlay.classList.add("open");
    adminDrawer.classList.add("open");
  }

  function closeAdminDrawer() {
    adminOverlay.classList.remove("open");
    adminDrawer.classList.remove("open");
  }

  adminClose.onclick = closeAdminDrawer;
  adminOverlay.onclick = closeAdminDrawer;

  adminLogout.onclick = () => {
    isAdmin = false;
    closeAdminDrawer();
  };

  adminTitleInput.onchange = (e) => {
    state.siteTitle = e.target.value;
    saveToFirebase(state);
  };

  function renderAdminCategories() {
    adminCategoryTags.innerHTML = "";
    state.categories.forEach(cat => {
      if (cat === "Усі") return;
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.innerHTML = `${cat} <button onclick="removeCategory('${cat}')">×</button>`;
      adminCategoryTags.appendChild(tag);
    });
  }

  window.removeCategory = function(catName) {
    state.categories = state.categories.filter(c => c !== catName);
    saveToFirebase(state);
  };

  addCategoryBtn.onclick = () => {
    const val = newCategoryInput.value.trim();
    if (val && !state.categories.includes(val)) {
      state.categories.push(val);
      newCategoryInput.value = "";
      saveToFirebase(state);
    }
  };

  function renderAdminProducts() {
    adminProductsList.innerHTML = "";
    state.products.forEach((p, index) => {
      const card = document.createElement("div");
      card.className = "product-admin-card";

      let photosHtml = "";
      for (let i = 0; i < 6; i++) {
        const photoUrl = (p.photos && p.photos[i]) ? p.photos[i] : "";
        photosHtml += `
          <div class="upload-box">
            ${photoUrl ? `<img src="${photoUrl}"><span class="remove-x" onclick="removePhoto('${p.id}',${i})">×</span>` : `+ Фото`}
            <input type="file" accept="image/*" onchange="uploadPhoto(event, '${p.id}', ${i})">
          </div>
        `;
      }

      card.innerHTML = `
        <div class="admin-row">
          <input type="text" value="${p.title}" placeholder="Назва" onchange="updateProduct('${p.id}', 'title', this.value)">
          <input type="number" value="${p.price}" placeholder="Ціна" style="max-width:100px;" onchange="updateProduct('${p.id}', 'price', Number(this.value))">
        </div>
        <div class="admin-row">
          <select onchange="updateProduct('${p.id}', 'category', this.value)">
            ${state.categories.filter(c => c !== "Усі").map(c => `<option value="${c}" ${c === p.category ? "selected" : ""}>${c}</option>`).join("")}
          </select>
        </div>
        <div class="admin-row">
          <textarea placeholder="Опис товару..." onchange="updateProduct('${p.id}', 'desc', this.value)">${p.desc}</textarea>
        </div>
        <div class="photo-slots">${photosHtml}</div>
        <div class="product-foot">
          <button class="btn danger" style="padding:6px 12px; font-size:12px; width:auto;" onclick="deleteProduct('${p.id}')">Видалити товар</button>
        </div>
      `;
      adminProductsList.appendChild(card);
    });
  }

  window.updateProduct = function(id, key, value) {
    const p = state.products.find(item => item.id === id);
    if (p) {
      p[key] = value;
      saveToFirebase(state);
    }
  };

  window.deleteProduct = function(id) {
    state.products = state.products.filter(item => item.id !== id);
    saveToFirebase(state);
  };

  addProductBtn.onclick = () => {
    const newProd = {
      id: Date.now().toString(),
      title: "Новий товар",
      category: state.categories[1] || "Без категории",
      price: 0,
      desc: "",
      photos: [],
      video: ""
    };
    state.products.push(newProd);
    saveToFirebase(state);
  };

  // ФУНКЦИЯ АВТОМАТИЧЕСКОГО СЖАТИЯ ИЗОБРАЖЕНИЙ
  function compressImage(file, maxWidth, quality, callback) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement("canvas");
        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        const compressedDataUrl = canvas.toDataURL("image/jpeg", quality);
        callback(compressedDataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  window.uploadPhoto = function(event, prodId, slotIndex) {
    const file = event.target.files[0];
    if (!file) return;

    // Сжимаем до max-width: 800px и качества 70%
    compressImage(file, 800, 0.7, function(compressedBase64) {
      const p = state.products.find(item => item.id === prodId);
      if (p) {
        if (!p.photos) p.photos = [];
        p.photos[slotIndex] = compressedBase64;
        saveToFirebase(state);
      }
    });
  };

  window.removePhoto = function(prodId, slotIndex) {
    const p = state.products.find(item => item.id === prodId);
    if (p && p.photos) {
      p.photos.splice(slotIndex, 1);
      saveToFirebase(state);
    }
  };

  exportBtn.onclick = () => {
    const currentHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const blob = new Blob([currentHtml], { type: "text/html;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "index.html";
    link.click();
  };

  listenToFirebase();
</script>

</body>
</html>
